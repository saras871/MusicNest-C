<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Details| MusicNest</title>
    <link rel="icon" type="image/png" href="images/icon-music-logo.png">
    <link rel="stylesheet" href="css/colors-fonts.css">
    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/musicgroup-page.css">
</head>

<body>
    <div class="content-bg">
        <header>
            <nav>
                <div class="brand">
                    <img src="images/icon-music-logo.png" alt="MusicNest logo" class="logo">
                    <h1>MusicNest</h1>
                </div>
                <ul class="navigation-items">
                    <li><a href="homepage.html">Home</a></li>
                    <li><a href="musicgroup-list-page.html">Music Groups</a></li>
                </ul>
            </nav>
        </header>
        <main class="musicgroup-main container standard-padding">
            <div class="content-left">
                <div class="card group-details">
                    <h1>Group Details</h1>
                    <div class="group-details-grid">
                        <div class="detail-item">
                            <div class="label">Group Name</div>
                            <div class="value" id="groupName"></div>
                        </div>
                        <div class="detail-item">
                            <div class="label">Genre</div>
                            <div class="value" id="groupGenre"></div>
                        </div>
                        <div class="detail-item">
                            <div class="label">Formed</div>
                            <div class="value" id="groupFormed"></div>
                        </div>
                        <div class="detail-item">
                            <div class="label">Albums</div>
                            <div class="value" id="groupAlbums"></div>
                        </div>
                    </div>
                </div>
                <h2 class="section-title">Members</h2>
                <div class="table-container">
                    <div class="members-table table">
                        <div class="table-header-wrapper">
                            <div class="table-header">
                                <p class="th">Name</p>
                                <p class="th">Born</p>
                            </div>
                        </div>
                        <div class="table-body" id="membersContainer">

                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom-section">
                <h2 class="section-title">Albums</h2>
                <div class="table-container">
                    <div class="albums-table table">
                        <div class="table-header-wrapper">
                            <div class="table-header">
                                <p class="th"></p>
                                <p class="th">Album Title</p>
                                <p class="th">Release Year</p>
                            </div>
                        </div>
                        <div class="table-body" id="albumsContainer">

                        </div>
                    </div>
                </div>
                <button class="view-all-btn btn hidden">View All</button>
            </div>
    </div>

    </main>
    </div>

    <footer>
        <p>© 2026 by Sara Sundqvist</p>
        <p>Icons designed by <a href="https://www.freepik.com/">Freepik</a></p>
    </footer>
</body>
<script src="javascript/musicgroup-page.js"></script>

</html>
