<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Groups | MusicNest</title>
    <link rel="icon" type="image/png" href="images/icon-music-logo.png">
    <link rel="stylesheet" href="css/colors-fonts.css">
    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/musicgroup-list.css">
</head>

<body>
    <div class="content-bg">
        <header>
            <nav>
                <div class="brand">
                    <img src="images/icon-music-logo.png" alt="MusicNest logo" class="logo">
                    <h1>MusicNest</h1>
                </div>
                <ul class="navigation-items">
                    <li><a href="homepage.html">Home</a></li>
                    <li><a href="musicgroup-list-page.html">Music Groups</a></li>
                </ul>
            </nav>
        </header>
        <main class="musicgroup-list-main container standard-padding">
            <div class="content-left">
                <h1>Music Groups</h1>
                <div class="actions">
                    <a href="add-new-group.html" class="btn add-new-btn"><span class="btn-icon">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg></span> Add New Group</a>
                    <form class="searchbar">
                        <input class="search-input input" type="text" placeholder="Search for a group...">
                        <button class="btn-secondary btn" type="submit">Search</button>
                    </form>
                </div>
                <div class="table-container">
                    <div class="musicgroup-table table">
                        <div class="table-header-wrapper">
                            <div class="table-header">
                                <p class="th image-header"></p>
                                <p class="th">Group Name</p>
                                <p class="th">Genre</p>
                                <p class="th">Formed</p>
                                <p class="th">Albums</p>
                                <p class="th btn-cell"></p>
                            </div>
                        </div>
                        <div class="table-body" id="groupsTableBody">
                           
                        </div>
                      
                    </div>
                </div>
                <div class="pagination">
                    <a id="btnPrev" href="#">&laquo;</a>
                  
                    <a id="btnNext" href="#">&raquo;</a>
                </div>
            </div>
    </div>
    </div>
    </main>

    <footer>
        <p>© 2026 by Sara Sundqvist</p>
        <p>Icons designed by <a href="https://www.freepik.com/">Freepik</a></p>
    </footer>
</body>
<script src="javascript/musicgroup-list-page.js"></script>

</html>
